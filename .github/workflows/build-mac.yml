name: Build macOS

on:
  workflow_dispatch:        # run manually from the Actions tab
  push:
    tags:
      - 'v*'                # also auto-run on tags like v2.0.0-beta

permissions:
  contents: write           # needed if you want to attach artifacts to a Release

# Opt JS-based actions into Node.js 24 immediately (silences the Node 20
# deprecation warning GitHub started showing in early 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build .app + .dmg
    strategy:
      fail-fast: false
      matrix:
        # macos-14 = Apple Silicon (arm64). Intel (x86_64) builds are
        # currently disabled — the resulting binary did not launch cleanly
        # on Intel Macs in previous attempts.
        include:
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}

    env:
      APP_NAME: "PolyWav Merger"
      APP_VERSION: "4.0.1-beta"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download static ffmpeg for ${{ matrix.arch }}
        run: |
          mkdir -p ffmpeg_bin
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            curl -L "https://www.osxexperts.net/ffmpeg7arm.zip" -o ffmpeg.zip
          else
            curl -L "https://www.osxexperts.net/ffmpeg7intel.zip" -o ffmpeg.zip
          fi
          unzip -o ffmpeg.zip -d ffmpeg_bin
          chmod +x ffmpeg_bin/ffmpeg
          file ffmpeg_bin/ffmpeg

      - name: Generate .icns from icon.png
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   icon.png --out icon.iconset/icon_512x512.png
          cp icon.png       icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon.icns

      - name: Build .app with PyInstaller (using committed .spec file)
        run: |
          # The repo ships polywav_merger_macos.spec which already defines
          # the BUNDLE(), bundle identifier, version, Info.plist keys and
          # the ffmpeg_bin layout. Using it avoids duplicating that config.
          pyinstaller polywav_merger_macos.spec --clean --noconfirm

      - name: Strip quarantine xattr from bundled ffmpeg
        run: |
          xattr -cr "dist/${{ env.APP_NAME }}.app"
          # Make sure the bundled ffmpeg is executable inside the .app
          find "dist/${{ env.APP_NAME }}.app" -name ffmpeg -exec chmod +x {} \;

      - name: Ad-hoc sign the .app (no Apple ID required)
        run: |
          # Ad-hoc signing avoids "app is damaged" errors on first launch
          # for users who don't right-click → Open. It's NOT notarization —
          # Gatekeeper will still warn on first launch, but the app is launchable
          # via right-click → Open.
          codesign --force --deep --sign - "dist/${{ env.APP_NAME }}.app"
          codesign --verify --verbose=2 "dist/${{ env.APP_NAME }}.app" || true

      - name: Create .dmg installer
        run: |
          mkdir -p dmg_staging
          cp -R "dist/${{ env.APP_NAME }}.app" dmg_staging/
          # Drag-to-Applications shortcut
          ln -s /Applications dmg_staging/Applications

          DMG_NAME="PolyWav_Merger_${{ env.APP_VERSION }}_${{ matrix.arch }}.dmg"
          hdiutil create \
            -volname "${{ env.APP_NAME }} ${{ env.APP_VERSION }}" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            "$DMG_NAME"

          ls -lh "$DMG_NAME"

      - name: Upload artifact (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: PolyWav-Merger-${{ env.APP_VERSION }}-${{ matrix.arch }}
          path: PolyWav_Merger_${{ env.APP_VERSION }}_${{ matrix.arch }}.dmg
          if-no-files-found: error

      - name: Attach .dmg to GitHub Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PolyWav_Merger_${{ env.APP_VERSION }}_${{ matrix.arch }}.dmg
          draft: false
          prerelease: true
